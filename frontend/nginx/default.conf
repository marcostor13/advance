server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Coolify / uptime healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml application/javascript
                    application/json application/xml image/svg+xml font/woff font/woff2;

    # index.html must never be cached — it references the hashed bundles
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Hashed assets — immutable (Angular outputHashing: "all")
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif)$ {
        include /etc/nginx/snippets/security-headers.conf;
        # no `always` — a 404 for a missing asset must not be cached for a year
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback — Angular Router needs this
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
